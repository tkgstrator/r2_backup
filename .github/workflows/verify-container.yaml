name: Verify container

on:
  pull_request:
    paths:
      - Dockerfile
      - bun.lock
      - package.json
      - src/**
      - tsconfig*.json
      - .github/workflows/verify-container.yaml
      - .github/workflows/deployment.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Container (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and verify runtime
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          IMAGE: node-security-verify:${{ strategy.job-index }}
        run: |
          set -euo pipefail
          container="node-security-$(cat /proc/sys/kernel/random/uuid)"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true; docker image rm "$IMAGE" >/dev/null 2>&1 || true' EXIT
          version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          docker buildx build --platform "$PLATFORM" --load --tag "$IMAGE" .
          docker run --pull never --rm --network none --name "$container" --env "EXPECTED_VERSION=$version" --entrypoint /bin/sh "$IMAGE" -c '
            set -eu
            [ "$(bun --version)" = "1.2.18" ]
            bun -e "if(require(\"/app/package.json\").version!==process.env.EXPECTED_VERSION)process.exit(1)"
            test -s /app/dist/index.js
            pg_dump --version | grep -E "PostgreSQL\) 17\."
            aws --version'
